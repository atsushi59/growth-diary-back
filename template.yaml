AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: growth-diary-back SAM Template (Fastify + Lambda + DynamoDB)

Parameters:
  AuthMode:
    Type: String
    Default: dummy
    Description: Authentication mode (e.g., dummy, cognito)
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Allowed origin for the images bucket CORS (frontend direct upload)
  FrontendOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Comma-separated allowed origins for the API CORS (e.g. https://xxx.amplifyapp.com)

Resources:
  # ------------------------------------------------------------
  # DynamoDB テーブル（1エンティティ1テーブル）
  # ------------------------------------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: cognitoSub
          AttributeType: S
      KeySchema:
        - AttributeName: cognitoSub
          KeyType: HASH

  ChildrenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  GrowthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: childId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: childId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  GrowthStandardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: gender
          AttributeType: S
        - AttributeName: metricAge
          AttributeType: S
      KeySchema:
        - AttributeName: gender
          KeyType: HASH
        - AttributeName: metricAge
          KeyType: RANGE

  # ------------------------------------------------------------
  # S3 バケット（画像保存。フロントから署名付き URL で直接アップロード）
  # ------------------------------------------------------------
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub growth-diary-images-${AWS::AccountId}
      # 完全非公開。閲覧・アップロードは Lambda 発行の署名付き URL 経由のみ
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # フロントからの直接 PUT（アップロード）/ GET（表示）を許可する
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  # ------------------------------------------------------------
  # Lambda 関数 & API Gateway
  # ------------------------------------------------------------
  FastifyApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Timeout: 10
      MemorySize: 512
      Environment:
        Variables:
          AUTH_MODE:
            Ref: AuthMode
          FRONTEND_ORIGINS:
            Ref: FrontendOrigins
          USERS_TABLE:
            Ref: UsersTable
          CHILDREN_TABLE:
            Ref: ChildrenTable
          GROWTH_TABLE:
            Ref: GrowthTable
          GROWTH_STANDARDS_TABLE:
            Ref: GrowthStandardsTable
          COGNITO_USER_POOL_ID:
            Ref: CognitoUserPool
          COGNITO_CLIENT_ID:
            Ref: CognitoUserPoolClient
          IMAGES_BUCKET:
            Ref: ImagesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName:
              Ref: UsersTable
        - DynamoDBCrudPolicy:
            TableName:
              Ref: ChildrenTable
        - DynamoDBCrudPolicy:
            TableName:
              Ref: GrowthTable
        - DynamoDBCrudPolicy:
            TableName:
              Ref: GrowthStandardsTable
        # 署名付き URL 発行のため、画像バケットへの読み書き権限を付与
        - S3CrudPolicy:
            BucketName:
              Ref: ImagesBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Sourcemap: true
        EntryPoints:
          - src/lambda.ts

  # ------------------------------------------------------------
  # Cognito ユーザープール
  # ------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: growth-diary-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: growth-diary-app-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false # フロントエンド（SPA）から直接通信するため false が必須
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value:
      Fn::Sub: "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value:
      Ref: CognitoUserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value:
      Ref: CognitoUserPoolClient
  ImagesBucketName:
    Description: "S3 bucket name for images"
    Value:
      Ref: ImagesBucket
