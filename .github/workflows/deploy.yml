name: Deploy to AWS
on:
  push:
    branches:
      - main

jobs:
  # まずテストを実行（DynamoDB Local は testcontainers が起動。ubuntu-latest は Docker 利用可）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # テスト成功時のみデプロイ（needs: test がゲート）
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC認証に必要
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::108917201039:role/GitHubActions-SAM-Deploy-Role
          aws-region: ap-northeast-1

      - run: sam build
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
