services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # ローカル開発はダミー認証（固定テストユーザー）
      AUTH_MODE: dummy
      # ローカルは DynamoDB Local に接続（SDK は region と credentials を要求するのでダミーを渡す）
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      USERS_TABLE: Users
      CHILDREN_TABLE: Children
      GROWTH_TABLE: Growth
      GROWTH_STANDARDS_TABLE: GrowthStandards
      # WSL/Docker のマウント越しは inotify が届かず tsx watch が変更を拾えないため、
      # chokidar をポーリング監視にしてホットリロードを効かせる（interval はCPU負荷とのバランスで 300ms）。
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      # AIボットの中継先（Python サービス）。compose 内はサービス名で解決する。
      AI_SERVICE_URL: "http://ai-service:8000"
    depends_on:
      - dynamodb-local
      - ai-service
    volumes:
      # ソースをマウントしてホットリロード（tsx watch が変更を検知）
      - .:/app
      # node_modules はコンテナ内のものを使う（ホストで上書きしない）
      - /app/node_modules

  # AIボットサービス（Python / FastAPI + Gemini）。Node からのみ呼ばれる内部サービス。
  ai-service:
    build: ./ai-service
    ports:
      # ホストから直接デバッグしたいとき用（8000 は dynamodb-local が使うので 8001 に割当）
      - "8001:8000"
    environment:
      # Gemini API キー。growth-diary-back/.env に GOOGLE_GEMINI_API_KEY を設定すると compose が読む。
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    # 名前付きボリュームへ書き込むため root で実行（権限エラー回避）
    user: root
    ports:
      # ホストから AWS CLI 等で覗きたいとき用（任意）
      - "8000:8000"
    # -dbPath で永続化（コンテナ再起動でもテーブル・データが残る）
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
