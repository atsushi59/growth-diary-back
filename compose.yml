services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # ローカル開発はダミー認証（固定テストユーザー）
      AUTH_MODE: dummy
      # ローカルは DynamoDB Local に接続（SDK は region と credentials を要求するのでダミーを渡す）
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      USERS_TABLE: Users
      CHILDREN_TABLE: Children
      GROWTH_TABLE: Growth
      GROWTH_STANDARDS_TABLE: GrowthStandards
    depends_on:
      - dynamodb-local
    volumes:
      # ソースをマウントしてホットリロード（tsx watch が変更を検知）
      - .:/app
      # node_modules はコンテナ内のものを使う（ホストで上書きしない）
      - /app/node_modules

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    # 名前付きボリュームへ書き込むため root で実行（権限エラー回避）
    user: root
    ports:
      # ホストから AWS CLI 等で覗きたいとき用（任意）
      - "8000:8000"
    # -dbPath で永続化（コンテナ再起動でもテーブル・データが残る）
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
